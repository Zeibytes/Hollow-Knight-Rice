"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'rose_pine'

format = """
[╭─](iris) $os$username$directory$git_branch$git_status
[╰─](iris) $character"""

right_format = '$cmd_duration$python$nodejs$rust$time'

[palettes.rose_pine]
base = '#191724'
surface = '#1f1d2e'
overlay = '#26233a'
muted = '#6e6a86'
subtle = '#908caa'
text = '#e0def4'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'

# openSUSE logo
[os]
disabled = false
format = '[$symbol]($style) '
style = 'bold foam'

[os.symbols]
openSUSE = ' '
SUSE = ' '
Linux = ' '

[username]
show_always = false
style_user = 'bold rose'
style_root = 'bold love'
format = '[$user]($style) '

[directory]
style = 'bold foam'
format = '[ $path]($style) '
truncation_length = 3
truncate_to_repo = true
read_only = ' '

[git_branch]
symbol = ' '
style = 'bold iris'
format = '[$symbol$branch]($style) '

[git_status]
style = 'bold love'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '⚔ '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕ '
untracked = '?${count} '
modified = '!${count} '
staged = '+${count} '
deleted = '✘${count} '

[character]
success_symbol = '[❯](bold foam)'
error_symbol = '[❯](bold love)'
vimcmd_symbol = '[❮](bold iris)'

[cmd_duration]
min_time = 2000
format = '[󰔛 $duration](gold) '

[python]
symbol = ' '
style = 'bold gold'
format = '[$symbol$version](fg:gold) '

[nodejs]
symbol = ' '
style = 'bold foam'
format = '[$symbol$version](fg:foam) '

[rust]
symbol = ' '
style = 'bold love'
format = '[$symbol$version](fg:love) '

[time]
disabled = false
time_format = '%H:%M'
format = '[ $time](fg:subtle)'
